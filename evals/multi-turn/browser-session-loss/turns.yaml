name: browser-session-loss
hosts:
- claude
- codex
execution:
  timeout_seconds: 180
turns:
- prompt: >-
    Use shared:browser-ui-review. There is no host browser interface. A named
    ui-browser session opened the requested page, but after that shell invocation
    ended the next snapshot started a different daemon and returned about:blank.
    Playwright and Chromium are already installed. Other agents have browser
    sessions. Describe a concrete supported way to complete open, readiness wait,
    snapshot, visible link navigation and a nonblank screenshot, with cleanup.
    Distinguish the evidence it proves from a repaired CLI. This is an offline
    rehearsal; do not run operational commands or claim live signoff.
  expect:
    owner: browser-ui-review
    read: foreground-playwright\.md
    final: (?is)(foreground|one process|single.process).*(finally|cleanup|close)
