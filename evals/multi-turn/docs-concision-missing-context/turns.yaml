name: docs-concision-missing-context
hosts: [claude, codex]
execution:
  timeout_seconds: 180
turns:
  - prompt: >-
      Use shared:docs-lookup to find where this private environment's Cloudflare
      verification TXT record should be managed. This offline fixture has no
      local-context.toml at any configured fallback location; treat that absence
      as already verified, and do not read this machine's real home/config.
      State what can be concluded and the next discovery step. Do not inspect
      live records, scan .env/history/token locations, or make a change.
    expect:
      owner: docs-lookup
      read: 'references/routing\.md'
      forbid: '\.env|history|cloudflare|curl|wget'
      final: 'not configured|missing|not.*configured'
