name: docs-concision-missing-context
hosts: [claude, codex]
execution:
  timeout_seconds: 180
turns:
  - prompt: >-
      Use shared:docs-lookup to find where this private environment's Cloudflare
      verification TXT record should be managed. This offline fixture has no
      local-context.toml at any configured fallback location; treat that absence
      as already verified, and do not read this machine's real home/config.
      State what can be concluded and the next discovery step. Do not inspect
      live records, scan .env/history/token locations, or make a change.
    expect:
      owner: docs-lookup
      read: 'references/routing\.md'
      forbid: '\.env|history|cloudflare|curl|wget'
      final_any:
        - '(source|docs|context|route|authority|location).{0,80}(not.{0,20}(configured|established)|isn.t configured|unconfigured|missing|absent|unestablished)'
        - '(missing|absent|unconfigured|unestablished).{0,80}(source|docs|context|route|authority|location)'
        - '(cannot|can.t|unable to).{0,40}(determine|establish|identify)'
      final_none:
        - '(^|[.;]\s*)(you should\s+)?(manage|add|create|edit|set|use)\b[^.!?]*\bCloudflare dashboard\b'
        - '(^|[.;]\s*)(the\s+)?(TXT\s+)?(record|zone|DNS|authority|provider)\b[^.!?]*(is|should be)\s+(managed|hosted|owned|handled|in)\b[^.!?]*Cloudflare'
      forbid_read: '\.env|history'
