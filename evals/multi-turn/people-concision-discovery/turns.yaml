name: people-concision-discovery
hosts: [claude, codex]
execution:
  timeout_seconds: 180
fixture_files:
  .local/scan-output/demo/final-plan.md: 'No people updates in this final plan.'
  .local/scan-output/demo/source-notes.md: 'people_resolver_smoke_checks: [Demo Alias]; classification unresolved, no durable identity facts verified.'
turns:
  - prompt: >-
      Use shared:people for review before closing out this new ignored local
      artifact group. Inspect both .local/scan-output/demo/final-plan.md and
      .local/scan-output/demo/source-notes.md. The final plan says no people
      updates. No people indexes exist in this fixture. Do not access real
      home/config, resolve against the machine, write an index or change files.
      Decide whether apply review can close and what remains to classify.
    expect:
      owner: people
      read: 'source-notes\.md'
      forbid: 'people_index\.py.*upsert|gh (issue|pr)|curl'
      final: 'block|classif|unresolved'
