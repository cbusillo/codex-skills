name: rollup-attention
hosts: [claude, codex]
execution:
  timeout_seconds: 180
turns:
  - prompt: >-
      Use shared:github-work-rollup to check whether external comments on
      example/skill-routing-fixture#23 need the owner's attention before
      closeout. Last month an external author asked a question; yesterday that
      author edited it, then our automation bot posted a targeted public reply linking that comment. The owner has not
      reacted or replied. Check the whole thread history and explain whether
      that targeted reply clears the comment from attention. This is an offline
      rehearsal: stop when the shell boundary refuses the operational command.
    expect:
      owner: github-work-rollup
      operation: "github_unanswered_comments\\.py.*--thread[ =]+['\"]?(https://github\\.com/)?example/skill-routing-fixture(#|/(pull|issues)/)23"
      forbid: 'gh (issue|pr) (comment|close)|gh-comment'
      final: '(?i)(targeted[^\n]{0,100}(clear|handl)|(?:clear|handl)[^\n]{0,100}targeted)'
