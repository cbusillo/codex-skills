name: owner-refs-status
hosts: [claude, codex]
execution:
  timeout_seconds: 180
turns:
  - prompt: >-
      Use shared:github-plan and read the full talking-with-the-owner reference
      linked from it. This is an offline report; do not query GitHub, change
      planning state, or run operational commands. My GitHub namespace is
      sample-owner. These verified records are the whole input:
      sample-owner/catalog issue 481, "Installer visibility", is done;
      sample-owner/service PR 481, "Retry receipts", is waiting on CI;
      another-owner/gateway issue 62, "Webhook timeout", waits for its maintainer.
      Give me a small status update covering all three and who takes each next step.
    expect:
      owner: github-plan
      read: talking-with-the-owner\.md
      forbid: gh\b|github_issue|gh-plan\.py
      final: '(?s)(?:.*\[[^\]\s]+#[0-9]+\]\(https://github\.com/[^/\s]+/[^/\s]+/(?:issues|pull)/[0-9]+\)\s+\S+){3}'
      final_none: ['\b(?:PR|issue)\s+#[0-9]+']
