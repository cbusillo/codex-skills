name: inbound-blocker-audit
hosts:
- claude
- codex
execution:
  timeout_seconds: 180
fixture_files:
  audit-result.json: '{"repo":"example/catalog","findings":[{"kind":"waiting_blocks_other_repository","number":17,"title":"Approve
    provider access","blocking":[{"repo":"example/site","number":93,"url":"https://github.com/example/site/issues/93"}]},{"kind":"coverage_incomplete","detail":"a
    bounded read was truncated or unavailable; drift beyond verified coverage is unreported","listings":["waiting_inbound_blockers"]}]}

    '
turns:
- prompt: Use shared:direction to explain this completed weekly audit for example/catalog. Its result
    is saved in audit-result.json; use that result instead of calling GitHub or marking the audit. Existing
    waits remain in effect. Give the owner the findings and the next step; do not decide or implement
    changes. This is an offline fixture with no write authority.
  expect:
    owner: direction
    forbid: gh-plan\.py.*(create|update-section|close)|gh-comment|gh-issue|dev-worktree|direction_mark\.py|\bgh\s+(issue|api|label|pr)\b
    final: (?s)(?=.*(?:#17\b|issues/17\b))(?=.*(?:#93\b|issues/93\b)).*
    final_any:
    - incomplete
    - truncat
    - partial
    - partly
    - cut short
    - unavailable
    final_none:
    - '(?m)^(?:Next(?: work| step)?\s*:\s*|I will\s*|We will\s*)(?:start|implement|work on)\s+#17\b'
