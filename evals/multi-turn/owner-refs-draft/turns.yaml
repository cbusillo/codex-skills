name: owner-refs-draft
hosts: [claude, codex]
execution:
  timeout_seconds: 180
turns:
  - prompt: >-
      Use shared:github and read the full talking-with-the-owner reference
      linked from it. Draft a concise GitHub PR comment for me; do not post it
      or run operational commands. Read-only file commands are allowed.
      My namespace is sample-owner. Verified facts:
      sample-owner/catalog PR 914 "Routing repair" implements
      sample-owner/catalog issue 812 "Helper selection"; its tests pass.
      another-owner/gateway issue 812 "Retry limits" remains with that maintainer.
      Explain the result and remaining work, referring to all three records.
      Also include these two machine-consumed lines verbatim in a code block:
      Fixes sample-owner/catalog#812
      uv run skills/github/scripts/gh-pr.py view 914
    expect:
      owner: github
      read: talking-with-the-owner\.md
      forbid: gh\b|gh-pr\.py
      final: '(?s)(?:.*\[[^\]\s]+#[0-9]+\]\(https://github\.com/[^/\s]+/[^/\s]+/(?:issues|pull)/[0-9]+\)\s+\S+){3}'
      final_none: ['\b(?:PR|issue)\s*#[0-9]+']
