name: closeout-landing-sha-missing
hosts: [claude, codex]
execution:
  timeout_seconds: 240
# A clean main checkout, as the prompt describes.
setup:
  - |
    git checkout -q -b main
    echo base > README.md
    git add README.md
    git commit -qm base
turns:
  - prompt: >-
      Use shared:work-closeout. example/skill-routing-fixture PR 45 has merged
      into main; its head commit was 8e3a1f0c2b4d6e8f0a1c3e5b7d9f1a2c4e6b8d0f.
      This directory is the installed skills runtime checkout: CODE_HOME
      resolves to it, and it is clean on main. Close out the local side of that
      merge. This is an offline rehearsal: the shell permission boundary
      prevents operational commands from executing. Read-only checks run when issued as simple commands without shell variables, loops, or pipes. Stop after that boundary
      refuses an operation and report what you attempted.
    # The head SHA is not the landing SHA; look up the merge commit instead of substituting it.
    expect:
      owner: [work-closeout, github]
      operation: 'gh-pr\.py.*\bview\b.*\b45\b|gh_pr_watch\.py.*--once|gh-with-env-token.*(?:pr view.*\b45\b|pulls/45\b)'
      forbid: '--landing-sha[= ]8e3a1f0c2b4d6e8f0a1c3e5b7d9f1a2c4e6b8d0f|gh-pr\.py.*\bmerge\b|pr merge|\bgit\b.*\b(?:pull|merge|reset|stash)\b'
