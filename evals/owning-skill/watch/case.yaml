schema_version: "1.1"
name: github-ci-watch
tags: [owning-skill]
runs: 3
execution:
  max_turns: 12
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  prompt: >-
    Use shared:github for example/skill-routing-fixture PR 17. I just pushed
    the review fix, and CI is still running. Keep watching its checks and
    review feedback until it settles; do not merge. This is an offline
    rehearsal: the shell permission boundary prevents commands from executing.
    Stop after that boundary refuses the operation and report what you attempted.
graders:
  - name: owning-skill-before-watch
    type: tool_order
    before: {tool: Skill, input_match: '"skill":"(?:shared:)?babysit-pr"'}
    after: {tool: Bash, input_match: 'gh_pr_watch\.py'}
  - name: helper-first
    type: tool_used
    tool: Bash
    input_match: 'gh(?:-with-env-token)?\s+pr\s+checks.*--watch'
    min: 0
    max: 0
  - name: reports-boundary
    type: regex
    pattern: 'blocked|denied|refus|permission|could not|cannot'
    flags: i
