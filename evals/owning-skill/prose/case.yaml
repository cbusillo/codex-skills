schema_version: "1.1"
name: adjacent-prose
tags: [owning-skill]
runs: 3
execution:
  max_turns: 4
  timeout_seconds: 90
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: >-
    Fix the spelling in this sentence and return only the corrected sentence:
    The pull requset is waiting for reveiw.
graders:
  - name: corrected-sentence
    type: regex
    pattern: '^The pull request is waiting for review\.$'
  - name: no-unneeded-skills
    type: tool_used
    tool: Skill
    min: 0
    max: 0
