schema_version: "1.1"
name: merge-discussion-only
tags: [owning-skill]
runs: 3
execution:
  max_turns: 6
  timeout_seconds: 120
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  prompt: >-
    Explain what a normal GitHub merge commit preserves compared with squashing
    a pull request. This is a conceptual question; do not inspect or change
    any repository or merge anything.
graders:
  - name: no-shell-operations
    type: tool_used
    tool: Bash
    min: 0
    max: 0
  - name: no-manual-only-skills
    type: tool_used
    tool: Skill
    input_match: '"skill":"(?:shared:)?(?:plan|rollout-friction|memory-distillation)"'
    min: 0
    max: 0
  - name: explains-history
    type: regex
    pattern: 'histor|parent|individual commits'
    flags: i
