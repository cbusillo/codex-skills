[[operations]]
id = "github.direction.audit_capacity"
request_priority = "bulk"
capabilities = ["metadata_read", "contents_read", "pull_requests_read", "issues_read"]
permission_mode = "fixed"
permission_note = "Runs only for OWNER/direction and uses existing metadata, Contents, Pull requests and Issues read grants with their safe probes; no profile expansion. The automation reader lists its installation's repositories; the Director's own reader lists the repositories that login owns. A failed per-repository read or a capped listing reports incomplete coverage under capacity_* listings; a failed repository listing aborts the audit. Missing Order or graph/native-link evidence, or an unreadable linked issue's labels, keeps the share unknown and the audit window open. Optional reporting maps add complete changed-file and linked-issue label reads using the same grants and probes; unreadable or capped files/labels, native links, or invalid maps report capacity_reporting_* coverage gaps and keep the window open. No new capability or profile grant. Never uses the search API."
entrypoint = "direction/scripts/direction_audit.py --repo OWNER/direction (capacity)"
intent = "Report each listed milestone's Track-graph issues closed in the window, open now and waiting on a person or event and count merged pull requests by tracked-issue graph attribution, own-project names from the merged overall Order or the own-project label on a pull request or its linked issue, and tooling fallback, the own-projects share, milestones closed, issues reopened and revert pull requests since the prior audit; optionally add Director-defined reporting kinds without changing admission or legacy counts."
current_transport = "composite"
endpoint_or_command = "GET /repos/{repo}/contents/DIRECTION.md; paged milestone-filtered Track issue inventory (listed or closed since window start) and native blocked_by/sub_issues graph; GraphQL pullRequest.closingIssuesReferences; paged GET /installation/repositories or /user/repos?affiliation=owner; per repository paged GET /repos/{repo}/pulls?state=closed&sort=updated&direction=desc stopping at the window start, paged GraphQL repository.issues(filterBy.since) with each issue's latest REOPENED_EVENT since the window start, up to 2 pages of /repos/{repo}/milestones?state=closed, and one cached GET /repos/{repo}/issues/{number} per distinct issue linked from an otherwise unattributed pull request outside own-project repositories; milestone outcomes reuse Track graph reads and current wait discussions (up to two comment pages per open issue) through the shared invocation cache; weekly runs use the existing four-worker pool for independent relationship, outcome and repository reads; with an optional reporting map, paged GET /repos/{repo}/pulls/{number}/files and cached GET /repos/{repo}/issues/{number} for every linked issue, including native links for already milestone-attributed PRs"
quota_bucket = "mixed"
actor_policy = "automation_required"
mutation_class = "read"
idempotency = "read_only"
retry_eligibility = "safe"
reconciliation_strategy = "fresh_read"
retained_graphql_rationale = "GraphQL closingIssuesReferences supplies native PR issue links omitted by REST pull listings. GraphQL issues filtered by update time read reopens without paging the repository event feed, which label and claim traffic pushes past any page cap in a busy repository. Repository and graph inventories use paged REST, never search."

