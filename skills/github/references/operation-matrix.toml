entrypoint = "github/scripts/gh-plan.py claim"
intent = "Claim an issue or PR-only work record; recheck ownership and agent-family assignment, record explicit Director routing overrides, and read back a claim before creating worktrees; preserve other ownership and dependency gates."
current_transport = "composite"
endpoint_or_command = "GraphQL PR, branch, comment, label and relationship inventories and their custody readbacks; existing REST issue metadata and event histories; read-only local Git/session/lease evidence; unchanged shared comment create and owned status PATCH"
