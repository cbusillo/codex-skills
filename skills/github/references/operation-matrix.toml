[[operations]]
id = "github.direction.audit_issues"
request_priority = "bulk"
capabilities = ["issues_read", "pull_requests_read", "metadata_read"]
permission_mode = "fixed"
permission_note = "Audit issue collection and stale-wait reporting use existing Issues, Pull requests and Metadata read grants and their safe probes; no default-profile expansion. Report-only mode does not stamp the direction marker. Failed prerequisite reads and input/page bounds expose incomplete report coverage without changing audit findings or exit status. Required issue-list read failures abort the audit. Overall Track milestone-wait validation reads up to two comment pages per evaluated native-path node and uses the claim structured-wait resolver with the same trusted authors; truncated, malformed or missing wait records remain review evidence, and a clear record cannot override labels or native dependencies. These reads reuse Issues read and its existing safe probe with no profile, grant or writer change. Overall Track milestone-wait validation adds bounded native-path reads under the same Issues grant; local wait findings use already-read bodies. Agent closeout may read up to two complete comment pages to recover an implementation PR absent from status; the PR must name this issue and land into its default branch. Later status edits do not invalidate mechanical delivery proof; remaining work and native holds stay visible and no issue closes automatically. These comment reads use the existing Issues read capability and safe probe, with no grant/profile change. Bounded inbound dependency read failures and capped listings report incomplete coverage; an incomplete closed-audit listing preserves the prior marker. The OWNER/direction audit also runs the stale-wait report and gate-phrase scan on each repository with a push in the window that is not archived and has no DIRECTION.md, with the same reads; their coverage limits are reported in active_unadopted and never hold the audit window open or stamp the marker. The --weekly mode reads the same account repository listing and each listed repository's DIRECTION.md to find adopted repositories, then runs these per-repository reads for each; a page-capped listing, a selected-repositories installation or a DIRECTION.md read other than a file or 404 refuses the weekly stamp. A repository counts as audited when its run was recorded. A held repository counts as audited: its window keeps its start, so the next audit rereads what failed or was capped. The receipt lists held repositories and their reasons, and the run exits 3. A repository with no recorded run, such as one whose audit raised an error, is unread and refuses the weekly stamp."
entrypoint = "direction/scripts/direction_audit.py --repo OWNER/REPO or --weekly --owner OWNER (issue collection)"
intent = "Read open audit questions and recently closed labeled work alongside who added issues to listed milestones and waiting cross-repository blockers and mechanically obsolete parked waits and active post-merge status without claiming completion."
current_transport = "rest_api"
endpoint_or_command = "Paged GET /repos/{repo}/issues with state, milestone, labels=audit and since filters; GET /repos/{repo}/issues/{number}/events; bounded GET /repos/{repo}/issues/{number}/dependencies/blocking for up to 50 waiting issues and 2 pages each; stale-wait report GET /repos/{repo}/issues/{number}/dependencies/blocked_by (2 pages per parked issue or active agent wait, inventory-sized issue bound, known-zero summaries skipped), GET /repos/{repo}/issues/{number} and /pulls/{number} for cached wait references; GET /repos/{repo} for the default branch when a wait explicitly requires landing or an active status names a merged PR; GET /repos/{repo}/issues/{number}/comments (2 pages for an agent closeout handoff without a status PR, then cached issue/pull reads per distinct reference and repository reads for associated merged pulls, subject to the caller's shared read budget; unavailable or exhausted reads expose incomplete evidence); bounded GET /repos/{repo}/issues/{number}, /dependencies/blocked_by, /sub_issues and up to two pages of /comments for overall Track paths; for OWNER/direction, the account repository listing, GET /repos/{repo}/contents/DIRECTION.md, paged open issues and up to 2 pages of open milestones per active unadopted repository"
quota_bucket = "rest_core"
actor_policy = "automation_required"
mutation_class = "read"
idempotency = "read_only"
retry_eligibility = "safe"
reconciliation_strategy = "fresh_read"
retained_graphql_rationale = "No GraphQL transport; issue lists and milestone events are repository-scoped REST reads."

[[operations]]
id = "github.direction.turn_record"
request_priority = "essential"
capabilities = ["issues_read", "issues_write"]
permission_mode = "fixed"
permission_note = "Uses the existing Issues read and write grants through gh-with-env-token and gh-issue; no profile expansion. The local marker is written first; failed path resolution or local persistence reports local_recorded false with exit 1 and attempts no shared write. A failed shared list or write is reported as shared.ok false with exit 2 and leaves other machines reminding, never a silent success. The writer pages through open issues oldest first and stops at the first record from a member or bot. When no record turns up and the listing did not finish within its page bound, it creates nothing and exits 2. Rewriting a record is idempotent. Two first writes at once may each create one; readers then take the newest stamp across all records and writers keep updating the oldest, so the duplicate is harmless."
entrypoint = "direction/scripts/direction_mark.py turn --owner OWNER (shared turn record)"
intent = "Keep one open issue in OWNER/direction holding the last daily turn, so the session-start reminder on every machine sees it."
current_transport = "rest_api"
endpoint_or_command = "GET /repos/{owner}/direction/issues?state=open&sort=created&direction=asc&per_page=100&page=N, page by page; then gh-issue edit on the oldest trusted tagged record, or gh-issue create only when every open issue was read and none exists"
quota_bucket = "rest_core"
actor_policy = "automation_required_for_writes"
mutation_class = "update"
idempotency = "conditional"
retry_eligibility = "conditional"
reconciliation_strategy = "read_after_write"
retained_graphql_rationale = "No GraphQL transport; the record is one repository-scoped issue body."

