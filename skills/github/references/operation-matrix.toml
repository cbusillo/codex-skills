schema_version = 2
permission_schema_version = 1

[metadata]
description = "Machine-readable foundation for public GitHub skill helper operations."
current_transport_semantics = "The transport used by the checked-in implementation today."
quota_bucket_semantics = "Quota bucket used by the checked-in implementation."
idempotency_semantics = "Provider-side repeat safety for the same logical request; retry policy must also consider write outcome and reconciliation."
terminal_contract_semantics = "Public helpers emit one schema-versioned terminal JSON envelope on stdout; human diagnostics stay on stderr and exit_code matches the process result."
graphql_operation_context_semantics = "GraphQL POST requests are classified explicitly as query, mutation, subscription, or conservative unknown so read failures do not receive mutation write-outcome semantics."
retry_policy_semantics = "Runtime retries are fail-closed and matrix-gated; safe reads may retry provider-classified transient failures, while writes also require confirmed not-started/rejected outcomes or operation-specific reconciliation."
retry_deadline_semantics = "The effective retry deadline is the earlier of GITHUB_RETRY_MAX_WAIT_SECONDS and an inherited absolute GITHUB_RETRY_DEADLINE_AT request deadline; subprocess execution, cooldown coordination, and reconciliation reads share that deadline."
shared_cooldown_semantics = "Cross-process cooldowns are keyed by GitHub host, actor, and quota bucket under CODE_HOME/state/github-retry with advisory locking, atomic state replacement, stale expiry, and post-reset drain spacing."
request_priority_semantics = "Essential reads and writes retain the main automation App; bulk reads use the optional configured read-only App before caching and quota admission. Missing reader credentials fall back only to the main App. Bulk REST core reads yield below 25 percent of their own identity's observed installation limit until reset. Writes always remain essential, including mixed-operation writes; reader writes are refused before sending."
actor_policy_semantics = "Automation-required operations use the configured bot token, active-human-required operations explicitly clear token environment variables and use the active local gh account, and split-identity operations verify both roles before protected workflow mutation."

[[operations]]
id = "github.attachment.download"
request_priority = "essential"
capabilities = ["metadata_read", "issues_read"]
permission_mode = "delegated"
permission_note = "Automation verifies the personally owned repository and exact issue-body or comment link. Q467 is checked with later withdrawals before fixed personal identity and attachment GETs; see cli-reference.md#comment-attachments for author scope. Output is restricted to task evidence. Other Directors retain the existing per-command route. No App grants or general own-user route changes."
entrypoint = "github/scripts/gh-attachment.py"
intent = "Save a private issue-body or comment attachment into private task evidence without exposing credentials or content."
current_transport = "composite"
endpoint_or_command = "Automation GET repository and issue or comment, Q467 approval and later decision comments; verified personal GET /user and https://github.com/user-attachments/files/{id}/{name} or https://github.com/user-attachments/assets/{uuid}; credential-free HTTPS asset redirects"
quota_bucket = "mixed"
actor_policy = "split_identity_required"
mutation_class = "read"
idempotency = "read_only"
retry_eligibility = "manual"
reconciliation_strategy = "fresh_read"
retained_graphql_rationale = "No GraphQL. Metadata uses the shared reader; a bounded non-retrying binary GET transport never forwards personal credentials to asset hosts."

[[operations]]
id = "github.app.setup"
request_priority = "essential"
capabilities = ["app_registration"]
permission_mode = "delegated"
permission_note = "Owner browser creates and installs a private App; setup derives the existing full-operation repository profile. App JWT verifies the newly selected installation, public user metadata supplies its commit identity and detects the registration account type before browser creation. Explicit previous-bot options use the existing owner-controlled provenance list; no personal owner is auto-trusted. The resolved configuration path and replaced primary login are reported, and private local configuration is written only after verification. No added default repository grant or protection write."
entrypoint = "github/scripts/github_app_setup.py start|resume|import"
intent = "Guide separate automation identity registration, installation verification and private wrapper configuration."
current_transport = "composite"
endpoint_or_command = "Owner form POST https://github.com/settings/apps/new (or organization equivalent); POST /app-manifests/{code}/conversions once; GET /app; GET /app/installations pages; GET /app/installations/{id}; GET /users/{owner}; GET /users/{bot}; private key/registration/local.env writes"
quota_bucket = "mixed"
actor_policy = "split_identity_required"
mutation_class = "mixed"
idempotency = "non_idempotent"
retry_eligibility = "manual"
reconciliation_strategy = "fail_closed_write"
retained_graphql_rationale = "No GraphQL. Registration conversion is not retried after an unknown outcome; owner can recover from GitHub settings with the import route. Saved successful registrations resume installation/configuration without recreating the App."

[[operations]]
id = "github.api.call"
request_priority = "essential"
capabilities = ["contents_read", "contents_write", "issues_read", "issues_write", "pull_requests_read", "pull_requests_write", "actions_read", "actions_write", "metadata_read", "checks_read", "statuses_read", "security_events_read", "vulnerability_alerts_read", "secret_scanning_alerts_read", "administration_read", "deployments_read", "workflows_write", "discussions_read", "discussions_write", "operator_session", "operator_actions_read", "environment_approve", "protection_write", "checks_publish", "statuses_publish", "deployments_publish", "projects_read", "packages_read", "projects_write", "packages_write"]
permission_mode = "input_dependent"
permission_note = "The credential check fails explicitly without a configured token, even with active-auth fallback enabled; it accepts no delegated command. The read-only --write-actor-for OWNER/REPO prefix accepts only a GET /user actor probe and applies write identity selection and authorization before comment selection. Malformed probe inputs emit a non-retryable local validation envelope before stdin capture or authentication; the API transport preserves delegated failures. No new API probes or grants. Passthrough permissions depend on the exact endpoint, method, owner and token type. These are intentionally supported operation families, not grants required for every invocation. Consult the linked capability before a new caller; unknown APIs are not covered by this profile."
entrypoint = "github/scripts/github_api.py call"
intent = "Execute one body-safe GitHub REST request and emit structured response, actor, quota, and failure evidence."
current_transport = "rest_api"
endpoint_or_command = "gh api --include --method {method} -H X-GitHub-Api-Version:{version} {path}; request body via --input -"
quota_bucket = "rest_core"
actor_policy = "automation_required"
mutation_class = "passthrough"
idempotency = "delegated"
retry_eligibility = "conditional"
reconciliation_strategy = "fail_closed_write"
retained_graphql_rationale = "No retained GraphQL transport; this command is the shared REST request and diagnostics boundary."

