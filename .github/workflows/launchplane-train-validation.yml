name: Launchplane Train Validation

on:
  push:
    branches:
      - "launchplane/train/**"

permissions:
  contents: read

jobs:
  validate:
    name: Validate Python ${{ matrix.python-version }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          cache-dependency-glob: "**/*.py"
          python-version: ${{ matrix.python-version }}

      - name: Ensure zsh for interactive shell behavior tests
        timeout-minutes: 5
        uses: ./.github/actions/setup-zsh

      - name: Validate skill files
        run: ./scripts/validate-skills.sh
