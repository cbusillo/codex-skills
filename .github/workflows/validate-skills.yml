name: Validate Skills

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    env:
      # Pull-request time budget for the gate; exceeding it adds a warning.
      TIME_BUDGET_SECONDS: "120"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Select lane
        id: lane
        run: |
          set -euo pipefail
          # The second Python lane only matters when executable files change,
          # and always runs when the selector requires the complete suite.
          run=true
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ matrix.python-version }}" != "$(cat .python-version)" ]] &&
            python3 scripts/select_validation_tests.py </dev/null >/dev/null; then
            if ! git diff --name-only HEAD^1 HEAD | grep -Eq '\.(py|sh)$|^\.github/|^uv\.toml$|^\.python-version$|/scripts/|^hooks/'; then
              run=false
              echo "::notice::No executable files changed; the ${{ matrix.python-version }} lane is skipped."
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Install uv
        if: steps.lane.outputs.run == 'true'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          cache-dependency-glob: "**/*.py"
          python-version: ${{ matrix.python-version }}

      - name: Ensure zsh for interactive shell behavior tests
        if: steps.lane.outputs.run == 'true'
        # A hung apt install then fails as a retryable step instead of using the job's whole budget.
        timeout-minutes: 5
        run: |
          if ! command -v zsh >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends zsh
          fi

      - name: Validate skills
        if: steps.lane.outputs.run == 'true'
        run: |
          set -euo pipefail
          started=$SECONDS
          ./scripts/validate-skills.sh
          elapsed=$((SECONDS - started))
          echo "Validation took ${elapsed}s (budget ${TIME_BUDGET_SECONDS}s)."
          if ((elapsed > TIME_BUDGET_SECONDS)); then
            echo "::warning title=CI time budget exceeded::Validation took ${elapsed}s; the budget is ${TIME_BUDGET_SECONDS}s."
          fi

      - name: Warn about change-detector tests
        if: steps.lane.outputs.run == 'true'
        run: uv run scripts/check_test_quality.py --repo . --format github

      - name: Check new comments and docstrings
        if: steps.lane.outputs.run == 'true'
        run: uv run scripts/check_new_comments.py --repo . --base HEAD^1 --format github
