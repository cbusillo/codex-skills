name: Validate Skills

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    env:
      # Pull-request time budget for the gate; exceeding it adds a warning.
      TIME_BUDGET_SECONDS: "120"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Select lane
        id: lane
        run: |
          set -euo pipefail
          # The second Python lane only matters when executable files change.
          run=true
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ matrix.python-version }}" != "$(cat .python-version)" ]]; then
            if ! git diff --name-only HEAD^1 HEAD | grep -Eq '\.(py|sh)$|^\.github/|^uv\.toml$|^\.python-version$|/scripts/|^hooks/'; then
              run=false
              echo "::notice::No executable files changed; the ${{ matrix.python-version }} lane is skipped."
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Install uv
        if: steps.lane.outputs.run == 'true'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          cache-dependency-glob: "**/*.py"
          python-version: ${{ matrix.python-version }}

      - name: Diagnose Node startup (temporary CS-992-D1 experiment)
        if: steps.lane.outputs.run == 'true'
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import concurrent.futures
          import pathlib
          import shutil
          import subprocess
          import tempfile
          import time

          node = shutil.which('node')
          tracer = shutil.which('strace')
          print('Node executable:', node, 'resolved:', pathlib.Path(node).resolve(), flush=True)
          print('Tracer:', tracer, flush=True)
          with tempfile.TemporaryDirectory() as directory:
              root = pathlib.Path(directory)
              alias = root / 'manual.mjs'
              alias.symlink_to(pathlib.Path('skills/openai-docs/scripts/fetch-codex-manual.mjs').resolve())
              def probe(index):
                  trace = root / f'trace-{index}'
                  args = [node, '--version'] if index == 0 else [node, str(alias), '--invalid-test-argument']
                  if tracer:
                      args = [tracer, '-f', '-ttt', '-T', '-o', str(trace), *args]
                  started = time.monotonic()
                  try:
                      result = subprocess.run(args, capture_output=True, timeout=5)
                      print(index, 'elapsed:', time.monotonic() - started, 'rc:', result.returncode, flush=True)
                  except subprocess.TimeoutExpired as error:
                      print(index, 'TIMEOUT:', time.monotonic() - started, 'stdout:', error.stdout, 'stderr:', error.stderr, flush=True)
                  if trace.exists():
                      lines = trace.read_text().splitlines()
                      print(index, 'trace tail:', '\n'.join(lines[-15:]), flush=True)
                      for line in lines:
                          if '<' in line:
                              try:
                                  duration = float(line.rsplit('<', 1)[1].rstrip('>'))
                              except ValueError:
                                  continue
                              if duration > 0.1:
                                  print(index, 'slow syscall:', line, flush=True)
              probe(0)
              with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
                  list(pool.map(probe, range(1, 21)))
          PY

      - name: Validate skills
        if: steps.lane.outputs.run == 'true'
        run: |
          set -euo pipefail
          started=$SECONDS
          ./scripts/validate-skills.sh
          elapsed=$((SECONDS - started))
          echo "Validation took ${elapsed}s (budget ${TIME_BUDGET_SECONDS}s)."
          if ((elapsed > TIME_BUDGET_SECONDS)); then
            echo "::warning title=CI time budget exceeded::Validation took ${elapsed}s; the budget is ${TIME_BUDGET_SECONDS}s."
          fi
