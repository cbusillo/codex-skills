name: Validate Skills

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    env:
      # Pull-request time budget for the gate; exceeding it adds a warning.
      TIME_BUDGET_SECONDS: "120"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Select lane
        id: lane
        run: |
          set -euo pipefail
          # The second Python lane only matters when executable files change.
          run=true
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ matrix.python-version }}" != "$(cat .python-version)" ]]; then
            if ! git diff --name-only HEAD^1 HEAD | grep -Eq '\.(py|sh)$|^\.github/|^uv\.toml$|^\.python-version$|/scripts/|^hooks/'; then
              run=false
              echo "::notice::No executable files changed; the ${{ matrix.python-version }} lane is skipped."
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Install uv
        if: steps.lane.outputs.run == 'true'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          cache-dependency-glob: "**/*.py"
          python-version: ${{ matrix.python-version }}

      - name: Diagnose parallel Node cohort (temporary CS-992-D1 experiment)
        if: steps.lane.outputs.run == 'true'
        run: |
          set -euo pipefail
          uv run python - <<'PYDIAG'
          import concurrent.futures
          import pathlib
          import shutil
          import subprocess
          import tempfile
          import time

          scripts = [
              'skills/github/scripts/validate-gh-plan.py',
              'skills/local-llm/scripts/validate_local_codex_agent.py',
              'skills/model-review/scripts/test_review_with_model.py',
              'skills/openai-docs/scripts/test_fetch_codex_manual.py',
          ]
          node = shutil.which('node')
          with tempfile.TemporaryDirectory() as directory:
              root = pathlib.Path(directory)
              wrapper = root / 'node'
              trace_root = root / 'traces'
              trace_root.mkdir()
              wrapper.write_text('#!/bin/bash\nexec strace -f -ttt -T -o "' + str(trace_root) + '/node-$$" ' + node + ' "$@"\n')
              wrapper.chmod(0o700)
              import os
              env = dict(os.environ, PATH=str(root) + ':' + os.environ['PATH'])
              def probe(script):
                  started = time.monotonic()
                  result = subprocess.run(['uv', 'run', script], env=env, capture_output=True, text=True, timeout=90)
                  print(script, 'elapsed:', time.monotonic() - started, 'rc:', result.returncode, 'stderr:', result.stderr[-5000:], flush=True)
              for iteration in range(6):
                  print('Cohort', iteration, flush=True)
                  with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
                      list(pool.map(probe, scripts))
              for trace in trace_root.iterdir():
                  lines = trace.read_text().splitlines()
                  print('Node trace', trace.name, 'first:', lines[:3], 'last:', lines[-3:], flush=True)
                  for line in lines:
                      if '<' in line:
                          try:
                              duration = float(line.rsplit('<', 1)[1].rstrip('>'))
                          except ValueError:
                              continue
                          if duration > 0.5:
                              print('slow syscall:', line, flush=True)
          PYDIAG

      - name: Validate skills
        if: steps.lane.outputs.run == 'true'
        run: |
          set -euo pipefail
          started=$SECONDS
          ./scripts/validate-skills.sh
          elapsed=$((SECONDS - started))
          echo "Validation took ${elapsed}s (budget ${TIME_BUDGET_SECONDS}s)."
          if ((elapsed > TIME_BUDGET_SECONDS)); then
            echo "::warning title=CI time budget exceeded::Validation took ${elapsed}s; the budget is ${TIME_BUDGET_SECONDS}s."
          fi
