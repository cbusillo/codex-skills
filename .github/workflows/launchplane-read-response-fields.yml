name: Launchplane Read Response Fields

# Fails when Launchplane main declares a bounded read field the catalog's
# allowlist does not accept. Launchplane's own CI runs the same check on its
# pull requests; this run is the backstop.
on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "47 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Launchplane read fields are accepted
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out Launchplane source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cbusillo/launchplane
          ref: main
          path: .local/launchplane-schema-source
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          cache-dependency-glob: ".local/launchplane-schema-source/uv.lock"

      - name: Generate Launchplane OpenAPI
        working-directory: .local/launchplane-schema-source
        run: uv run --locked launchplane service export-openapi --output "$RUNNER_TEMP/launchplane-openapi.json"

      - name: Check Launchplane main's read fields against the allowlists
        run: uv run skills/launchplane/scripts/check-read-response-fields.py --openapi "$RUNNER_TEMP/launchplane-openapi.json"
