name: Launchplane Read Response Fields

# Fails when the pinned read response fields differ from the ones Launchplane
# declares on main. The daily run catches a Launchplane change between
# codex-skills pull requests, before an added field stops a bounded read.
on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "47 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Pinned read fields match Launchplane
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out Launchplane source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: cbusillo/launchplane
          ref: main
          path: launchplane-source
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          cache-dependency-glob: |
            skills/launchplane/scripts/sync-read-response-fields.py
            launchplane-source/uv.lock
            launchplane-source/pyproject.toml
            launchplane-source/.python-version
          python-version: "3.12"

      - name: Generate the producer schema
        working-directory: launchplane-source
        run: uv run --python "$(cat .python-version)" --locked launchplane service export-openapi --output "${RUNNER_TEMP}/launchplane-openapi.json"

      - name: Compare the pin with Launchplane main
        run: uv run skills/launchplane/scripts/sync-read-response-fields.py check --openapi-file "${RUNNER_TEMP}/launchplane-openapi.json"
