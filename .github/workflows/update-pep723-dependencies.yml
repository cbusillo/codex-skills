name: Update PEP 723 Dependencies

# The calculate job resolves and tests new pins without OIDC or a write token.
# Only the submit job may request OIDC. It runs this run's own trusted source,
# treats the candidate artifact as data, and asks Launchplane to open the PR.
on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-pep723-dependencies
  cancel-in-progress: false

jobs:
  calculate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      attempt: ${{ github.run_attempt }}
      changed: ${{ steps.package.outputs.changed }}
      digest: ${{ steps.package.outputs.digest }}
    steps:
      - name: Check out the run commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          cache-dependency-glob: "**/*.py"
          python-version: "3.12"

      - name: Resolve PEP 723 dependency updates
        run: uv run scripts/update_pep723_dependencies.py --update

      - name: Package the candidate before the new pins run
        id: package
        run: uv run scripts/pep723_proposal.py package "$RUNNER_TEMP/pep723-candidate"

      - name: Validate the candidate repository
        if: steps.package.outputs.changed == 'true'
        run: |
          set -euo pipefail
          if ! command -v zsh >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends zsh
          fi
          ./scripts/validate-skills.sh

      - name: Upload the validated candidate
        if: steps.package.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pep723-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pep723-candidate
          if-no-files-found: error
          retention-days: 7

  submit:
    needs: calculate
    if: needs.calculate.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the trusted run source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # Re-running only this job resends the same candidate's identical request.
      - name: Download this run's candidate outside the checkout
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pep723-candidate-${{ github.run_id }}-${{ needs.calculate.outputs.attempt }}
          path: ${{ runner.temp }}/pep723-candidate

      # The runner's own Python runs only standard-library code from this
      # checkout; no dependency is installed in the job that holds OIDC.
      - name: Validate the candidate as data and build the request
        id: prepare
        env:
          CANDIDATE_RUN_ATTEMPT: ${{ needs.calculate.outputs.attempt }}
          EXPECTED_DIGEST: ${{ needs.calculate.outputs.digest }}
        run: >-
          python3 -E -s scripts/pep723_proposal.py prepare
          "$RUNNER_TEMP/pep723-candidate" "$RUNNER_TEMP/pep723-request.json"

      - name: Request an App-authored proposal from Launchplane
        id: proposal
        uses: cbusillo/launchplane/.github/actions/launchplane-request@88b024d3d093e400c7b134d922105f6ebf63543a # launchplane-request
        with:
          launchplane-url: ${{ vars.LAUNCHPLANE_PUBLIC_URL }}
          route-path: /v1/source-control/updater-proposals
          payload-file: ${{ runner.temp }}/pep723-request.json
          timeout-ms: "60000"
          output-paths: disposition=disposition,pull_request_url=pull_request_url,head_sha=head_sha
          response-output-file: ${{ runner.temp }}/pep723-response.json
          log-response-body: "false"

      - name: Report the actual proposal outcome
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        env:
          SUBMIT_OUTCOME: ${{ steps.proposal.outcome }}
          SUBMIT_STATUS: ${{ steps.proposal.outputs.status-code }}
          RESPONSE_DISPOSITION: ${{ steps.proposal.outputs.disposition }}
          RESPONSE_PULL_REQUEST_URL: ${{ steps.proposal.outputs.pull_request_url }}
          RESPONSE_HEAD_SHA: ${{ steps.proposal.outputs.head_sha }}
        run: >-
          python3 -E -s scripts/pep723_proposal.py summary
          "$RUNNER_TEMP/pep723-request.json" "$RUNNER_TEMP/pep723-response.json"

      - name: Retain the exact request and any response for reconciliation
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pep723-proposal-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pep723-request.json
            ${{ runner.temp }}/pep723-response.json
          if-no-files-found: warn
          retention-days: 7
