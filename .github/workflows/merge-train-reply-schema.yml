name: Merge-Train Reply Schema

# Fails when the pinned controller reply schema differs from the one
# Launchplane publishes on main. The daily run catches a Launchplane change
# between codex-skills pull requests.
on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "41 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Pinned schema matches Launchplane
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          cache-dependency-glob: "**/*.py"
          python-version: "3.12"

      - name: Compare the pin with Launchplane main
        run: uv run skills/launchplane/scripts/sync-merge-train-reply-schema.py check
