name: Client placeholders
description: Reject unresolved Client facts in committed shipping content
inputs:
  paths:
    description: Newline-separated committed file or directory paths for content included in the product
    required: true
  repository-root:
    description: Checked-out product repository
    default: .
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
    - shell: bash
      env:
        SHIP_PATHS: ${{ inputs.paths }}
        REPOSITORY_ROOT: ${{ inputs.repository-root }}
      run: |
        paths=()
        while IFS= read -r path; do
          [[ -z "$path" ]] || paths+=("$path")
        done <<< "$SHIP_PATHS"
        uv run --no-project --python 3.12 "$GITHUB_ACTION_PATH/../../../skills/github/scripts/check_client_placeholders.py" --repo-root "$REPOSITORY_ROOT" "${paths[@]}"
